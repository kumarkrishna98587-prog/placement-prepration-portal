{% extends 'base.html' %}{% block content %}<section class="form-card wide"><h1>Student Resume Builder</h1><form method="post"><label>Full name</label><input name="name" required><label>Email</label><input type="email" name="email"><label>Phone (optional)</label><input name="phone"><label>Education</label><textarea name="education" placeholder="Diploma in Computer Science Engineering"></textarea><label>Skills</label><textarea name="skills" placeholder="HTML, CSS, JavaScript, Python, SQL"></textarea><label>Career objective</label><textarea name="objective"></textarea><button class="btn">Preview Resume</button></form>
{% if data %}<hr><div class="resume"><h2>{{data.name}}</h2><p>{{data.email}} · {{data.phone}}</p><h3>Career Objective</h3><p>{{data.objective}}</p><h3>Education</h3><p>{{data.education}}</p><h3>Skills</h3><p>{{data.skills}}</p><button class="btn" onclick="window.print()">Print / Save as PDF</button></div>{% endif %}</section>{% endblock %}
