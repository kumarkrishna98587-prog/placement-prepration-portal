{% extends 'base.html' %}{% block content %}<section class="form-card wide"><h1>Aptitude Practice</h1><form method="post">{% for q in questions %}{% set qindex = loop.index0 %}<div class="question"><h3>{{loop.index}}. {{q[0]}}</h3>{% for option in q[1] %}<label class="choice"><input type="radio" name="q{{qindex}}" value="{{loop.index0}}" required> {{option}}</label>{% endfor %}</div>{% endfor %}<button class="btn">Submit Test</button></form></section>{% endblock %}
